name: Tests and security checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install dependencies and security tools
        run: python -m pip install -r requirements.txt bandit pip-audit
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Scan application source
        run: python -m bandit main.py
      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.txt
